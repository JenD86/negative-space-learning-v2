dev = true
model_name = "vllm:Qwen/Qwen2.5-Coder-7B-Instruct-AWQ"
gpu_memory_utilization = 0.85
code_host_cache_path = "./code/test-loop/code/"
container_ids = ["special-learn-compose_service-a_1", "special-learn-compose_service-b_1"]
main_container_idx = 0
dynamic_container = true
docker_compose_dir = "./docker/special-learn-compose"
train_data_save_folder = "./data/test-loop/train_data"

[inference]
max_tokens = 2048
timeout = 120

[vllm]
served_model_name = "nsl-test-loop"

[episode]
action_budget = 5
scratchpad_max_chars = 5000
scratchpad_storage_path = "./data/test-loop/scratchpad.json"
success_threshold_kb = 0.0

[generation]
target_successful_rows = 10
max_episodes = 20
container_restart_interval = 5
container_rebuild_interval = 10
max_consecutive_verification_failures = 5
variation_strategy = "round_robin"
post_rebuild_wait_seconds = 3
checkpoint_every_episode = true
resume_from_checkpoint = false
show_progress = true
generation_output_dir = "./data/test-loop/generations"
reset_scratchpad_between_episodes = true

[training]
base_model = "unsloth/Qwen2.5-Coder-7B-Instruct-bnb-4bit"
max_steps = 10
per_device_train_batch_size = 1
gradient_accumulation_steps = 1
learning_rate = 2e-4
warmup_steps = 2
max_seq_length = 1024
adapter_output_dir = "./models/adapters/test-loop"
report_to = "none"

[orchestration]
num_generations = 2
training_window_size = 3
